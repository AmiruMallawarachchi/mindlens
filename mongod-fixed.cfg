# mongod.conf

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# Where and how to store data.
storage:
  dbPath: C:\Program Files\MongoDB\Server\8.3\data
  # Capped deliberately. This machine has ~7GB RAM and the app loads five
  # PyTorch models (~2.5-3.5GB resident). WiredTiger's default cache is
  # about half of (RAM - 1GB), so MongoDB would reserve ~3GB on top of that
  # and lose the resulting fight - every crash in mongod.log was literally
  # "out of memory". This app stores a handful of users and 67 RAG chunks;
  # 0.25GB of cache is ample.
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25

# where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path: C:\Program Files\MongoDB\Server\8.3\log\mongod.log

# network interfaces
net:
  port: 27017
  bindIp: 127.0.0.1

#processManagement:

#security:

#operationProfiling:

#replication:

#sharding:

## Enterprise-Only Options:

#auditLog:
