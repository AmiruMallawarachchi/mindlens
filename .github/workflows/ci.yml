name: MindLens CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint backend
        run: python -m ruff check backend/app backend/tests

      - name: Run backend tests
        env:
          APP_ENV: test
          DEBUG: "false"
          USE_OPENAI_STUBS: "true"
        run: python -m pytest backend/tests -q --cov=backend/app --cov-report=term-missing

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Scan backend source
        run: python -m bandit -q -r backend/app -ll

      - name: Check for committed secrets
        shell: bash
        run: |
          detect-secrets scan --force-use-all-plugins \
            backend/app backend/Dockerfile backend/.env.example render.yaml .github/workflows \
            | python -c 'import json, sys; results=json.load(sys.stdin)["results"]; print(json.dumps(results, indent=2) if results else "No secrets detected"); raise SystemExit(1 if results else 0)'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: next 16, nanoid 6 and camera-controls all declare
          # engines requiring >=22, and npm ci warns EBADENGINE on 20.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
