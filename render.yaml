# Render blueprint for the current MindLens V2 backend (see
# docs/V2_HOSTED_DEPLOYMENT.md).
#
# V2 has no local model weights and no Chroma index: inference is Groq,
# retrieval is Pinecone, and persistence is MongoDB Atlas. The free plan is
# sufficient for this container. It sleeps after about 15 minutes without
# traffic and cold-starts in about a minute; the filesystem is ephemeral, so
# no database or index may be stored there.
services:
  - type: web
    name: mindlens-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_OPENAI_STUBS
        value: "false"
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: mindlens
      - key: GROQ_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_ENABLED
        value: "true"
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
