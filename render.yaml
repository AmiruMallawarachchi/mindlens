# Documented alternative to the primary deployment (a free Hugging Face
# Docker Space — see docs/DEPLOYMENT.md). Kept correct and current, not
# actively used: the five models want roughly 2.5–3.5GB resident, so this
# needs at least Render's `pro` plan (4GB) to actually boot — the `standard`
# plan below (2GB) will OOM on startup with PRELOAD_MODELS=true, and leaving
# it false just moves that failure onto a live user's first message instead
# (see loader.py's _load_lock comment for what that looked like locally:
# concurrent cold loads timing out and one request paying for all of them).
# Bump `plan` before using this path for real.
services:
  - type: web
    name: mindlens-api
    runtime: docker
    region: singapore
    plan: standard
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: USE_OPENAI_STUBS
        value: "false"
      - key: PRELOAD_MODELS
        value: "true"
      - key: PRELOAD_RAG
        value: "true"
      - key: CHROMADB_PERSIST_DIR
        value: /var/data/chroma
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: mindlens
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
    disk:
      name: mindlens-data
      mountPath: /var/data
      sizeGB: 10
